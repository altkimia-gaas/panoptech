}
.stab:hover{background:var(--bg3);color:var(--text)}
.stab.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* SLIDE TABS */
.slidetabs{

  </div>
  <div class="diag-row">
    <div class="diag-icon" style="background:var(--amber-dim)"><i class="ti ti-alert-triangle" aria-hidden="true" style="font-size:14px;color:var(--amber)"></i></div>
    <div><div class="diag-title">Sin estrategia para evitar licitación — 12 a 18 meses mata la ventana política</div><div class="diag-body">La discusión presupuestaria 2027 es en septiembre. Sin piloto activo antes de eso, no hay argumento para el presupuesto.</div></div>
  </div>
  <div class="diag-row">
    <div class="diag-icon" style="background:var(--red-dim)"><i class="ti ti-alert-triangle" aria-hidden="true" style="font-size:14px;color:var(--red)"></i></div>
    <div><div class="diag-title">Falso positivo de alto perfil puede paralizar el proyecto políticamente</div><div class="diag-body">Sin protocolo explícito de que el sistema no es causa única de detención, el riesgo es sistémico.</div></div>
  </div>
  <div class="diag-row">
    <div class="diag-icon" style="background:var(--amber-dim)"><i class="ti ti-alert-triangle" aria-hidden="true" style="font-size:14px;color:var(--amber)"></i></div>
    <div><div class="diag-title">Sin campeón institucional local el sistema muere por inercia burocrática</div><div class="diag-body">Funcionarios en terreno ya están sobrecargados. Un sistema que agrega carga sin simplificar el trabajo será abandonado.</div></div>
  </div>
</div>`},
{label:'Recomendaciones',h:`
<div class="sh"><div class="snum">AR</div><div>
  <div class="stitle">Plan de acción — 11 recomendaciones secuenciadas</div>
  <div class="ssub">por urgencia · esta semana · próximas 2 semanas</div>
</div></div>
<div class="slabel">Esta semana — bloqueantes del proceso</div>
<div class="monitor">
  <div class="rec-row"><div class="rec-num">1</div><div><div class="rec-title">Producir dos documentos separados</div><div class="rec-body">Deck político 12 láminas para Ministra/subsecretarios. Documento técnico 25 páginas para equipos ministeriales. Son lógicas argumentales distintas.</div></div></div>
  <div class="rec-row"><div class="rec-num">2</div><div><div class="rec-title">Decidir estrategia de naming público</div><div class="rec-body">Panoptech como nombre interno es viable. Una vez que el nombre circula en el ecosistema institucional es muy difícil cambiarlo.</div></div></div>
  <div class="rec-row"><div class="rec-num">3</div><div><div class="rec-title">Contratar abogado especialista en contratación pública</div><div class="rec-body">Para definir cuál de las tres opciones contractuales es jurídicamente más rápida. Sin ese insumo, cualquier negociación con el Ministerio es prematura.</div></div></div>
  <div class="rec-row"><div class="rec-num">4</div><div><div class="rec-title">Encargar memo jurídico a constitucionalista</div><div class="rec-body">2 páginas que distingan trazabilidad judicial focalizada de vigilancia masiva. Es el escudo ante cualquier cuestionamiento público o parlamentario.</div></div></div>
</div>
<div class="slabel">Próximas 2 semanas — sustento técnico y financiero</div>
<div class="monitor">
  <div class="rec-row"><div class="rec-num">5</div><div><div class="rec-title">Demo funcional módulo ACIP</div><div class="rec-body">Sin demo, no hay conversación técnica seria. El módulo más simple es el más rápido de mostrar y el más comprensible para audiencias no técnicas.</div></div></div>
  <div class="rec-row"><div class="rec-num">6</div><div><div class="rec-title">Levantar estado de APIs en Registro Civil, Poder Judicial y PDI</div><div class="rec-body">Determina el timeline real de implementación. El pitch político probablemente está prometiendo plazos que la realidad técnica no puede cumplir.</div></div></div>
  <div class="rec-row"><div class="rec-num">7</div><div><div class="rec-title">Redactar política de gobernanza de datos completa</div><div class="rec-body">Es el documento que los abogados del Ministerio pedirán primero. Sin él, ningún equipo jurídico institucional avanza.</div></div></div>
  <div class="rec-row"><div class="rec-num">8</div><div><div class="rec-title">Encargar cuantificación del costo de prófugos a economista</div><div class="rec-body">Con datos del Ministerio Público y Carabineros. Ese número es la piedra angular del caso de negocio y debe ser defendible ante Dipres.</div></div></div>
  <div class="rec-row"><div class="rec-num">9</div><div><div class="rec-title">Preparar kit de prensa pre-crisis</div><div class="rec-body">Nota oficial, FAQ ciudadano y declaración tipo para voceros. La crisis comunicacional no se maneja en el momento de la crisis.</div></div></div>
  <div class="rec-row"><div class="rec-num">10</div><div><div class="rec-title">Definir KPIs del piloto con el equipo técnico del Ministerio</div><div class="rec-body">Antes de comenzar, no después de ver los resultados. Si los criterios se definen ex post siempre hay presión para interpretar favorablemente.</div></div></div>
  <div class="rec-row"><div class="rec-num">11</div><div><div class="rec-title">Contacto informal con el Consejo para la Transparencia</div><div class="rec-body">Para explorar rol de fiscalización. Convertirlo en aliado antes de que el sistema sea público neutraliza el argumento de opacidad.</div></div></div>
</div>`},

{label:'01 · Problema',h:`
<div class="sh"><div class="snum">01</div><div>
  <div class="stitle">El problema que el norte conoce mejor que nadie</div>

</div></div>
<div class="krow">

  <div class="kbox"><div class="knum">3</div><div class="klabel">Únicos controles actuales</div></div>
  <div class="kbox"><div class="knum">40%</div><div class="klabel">Reinciden durante evasión</div></div>
  <div class="kbox"><div class="knum">+$80M</div><div class="klabel">Costo anual estimado USD</div></div>
</div>
<div class="slabel">Los 3 controles actuales — todos insuficientes</div>
<div class="g3">
  <div class="card card-red"><div class="ctitle">Salida del país</div><div class="cbody">Único control automático. Inútil si el prófugo no tiene intención de salir. Cubre menos del 5% de los escenarios posibles.</div></div>
  <div class="card card-red"><div class="ctitle">Control policial en calle</div><div class="cbody">Depende del azar y disponibilidad operativa. No es sistemático, ni trazable, ni escalable.</div></div>
  <div class="card card-red"><div class="ctitle">Detención directa</div><div class="cbody">Solo ocurre cuando el sujeto comete un nuevo delito. El sistema actúa cuando ya hubo otra víctima.</div></div>
</div>
<div class="slabel">Por qué el norte es el escenario más crítico</div>
<div class="card card-blue"><div class="cbody">Arica, Tarapacá y Antofagasta concentran el mayor flujo de personas de interés del país: migración irregular, crimen organizado transfronterizo, rutas de tráfico y redes de apoyo logístico. El piloto norte no es una decisión técnica — es una decisión estratégica.</div></div>`},
{label:'02 · Oportunidad',h:`
<div class="sh"><div class="snum">02</div><div>

</div></div>
<div class="qblock"><div class="qtext">"El Estado recupera la soberanía en cada espacio estratégico. Sistemas integrados para convertir detenciones en sentencias efectivas."</div><div class="qsrc">Plan Nacional de Seguridad Pública · Ministra Trinidad Steinert · Mayo 2026</div></div>
<div class="slabel">Los 3 pilares del plan y cómo Panoptech los cumple</div>
<div class="g3">
  <div class="card card-blue"><div class="badge bb" style="margin-bottom:6px">Pilar 1</div><div class="ctitle">Control territorial</div><div class="cbody">Cubre las 6 dimensiones del plan: fronteras, rutas, calles, cárceles, puertos, territorios complejos.</div></div>
  <div class="card card-blue"><div class="badge bb" style="margin-bottom:6px">Pilar 2</div><div class="ctitle">Eficacia persecutoria</div><div class="cbody">Dato de identidad a alerta judicial en menos de 30 segundos. Cierra el gap entre orden emitida y captura efectiva.</div></div>
  <div class="card card-blue"><div class="badge bb" style="margin-bottom:6px">Pilar 3</div><div class="ctitle">Poder institucional</div><div class="cbody">Multiplica capacidad operativa sin aumentar dotación ni presupuesto fijo.</div></div>
</div>
<div class="g2">
  <div class="card card-amber"><div class="ctitle">La ventana presupuestaria se cierra</div><div class="cbody">La discusión de la LP 2027 comienza en septiembre. El piloto con resultados en agosto tiene argumentos. El que espere, no tiene presupuesto.</div></div>
  <div class="card card-green"><div class="ctitle">Sin nueva ley requerida</div><div class="cbody">Cada módulo opera bajo normativa vigente. Cero trámite legislativo. Se puede contratar y operar en semanas.</div></div>
</div>`},
{label:'03 · Solución',h:`
<div class="sh"><div class="snum">03</div><div>
  <div class="stitle">Cómo funciona Panoptech</div>
  <div class="ssub">app móvil patentada · 8 módulos · integrador central · alerta en tiempo real</div>
</div></div>
<div class="ibox"><div class="it">Panoptech no reemplaza los sistemas institucionales — los conecta</div><div class="ib">SIAP, SABI y los sistemas del Poder Judicial siguen operando. Panoptech es la capa de integración que los hace hablar entre sí en tiempo real. Hoy eso no existe y ninguna institución puede construirlo sola.</div></div>
<div class="slabel">El flujo en 4 pasos</div>
<div class="stepper">
  <div class="step"><div class="stepnum">1</div><div><span class="steplabel">Captura</span><span class="stepdesc">Operador escanea documento de identidad con app móvil patentada en cualquier punto de control.</span></div></div>
  <div class="step"><div class="stepnum">2</div><div><span class="steplabel">Transmisión segura</span><span class="stepdesc">Dato georreferenciado viaja cifrado por canal dedicado. TLS 1.3. Fuera de internet público.</span></div></div>
  <div class="step"><div class="stepnum">3</div><div><span class="steplabel">Cotejo en tiempo real</span><span class="stepdesc">Motor compara contra órdenes vigentes del Poder Judicial. No almacena — consulta.</span></div></div>
  <div class="step stephi"><div class="stepnum">4</div><div><span class="steplabel">Alerta al operador — menos de 30 segundos</span><span class="stepdesc">El operador humano recibe la alerta y decide la acción. El sistema informa. No detiene.</span></div></div>
</div>
<div class="slabel">Los 8 módulos del sistema</div>
<div class="mgrid">
  <div class="mitem"><div class="mcode">ACIP</div><div class="mname">Control policial</div></div>
  <div class="mitem"><div class="mcode">AVN</div><div class="mname">Vuelos nacionales</div></div>

  <div class="mitem"><div class="mcode">AFIM</div><div class="mname">Inspectores mun.</div></div>

<div class="sbox"><div class="st2">Ventaja táctica diferencial</div><div class="sb">La mayoría de los proyectos GovTech en seguridad mueren en el análisis jurídico. Aquí ese paso ya está resuelto. Se puede contratar y operar sin esperar reformas.</div></div>

</div>
<div class="card card-green" style="margin-top:10px"><div class="ctitle">Antecedente institucional validado — Registro Viajeros PDI 2016</div><div class="cbody" style="margin-top:4px">Panoptech es la evolución técnica e institucional de ese antecedente: 8 módulos, todos los actores del ecosistema, en tiempo real.</div></div>`},
{label:'05 · Gobernanza',h:`
<div class="sh"><div class="snum">05</div><div>
  <div class="stitle">Garantías ciudadanas y gobernanza de datos</div>
  <div class="ssub">privacidad por arquitectura · acceso ciudadano · fiscalización independiente</div>
</div></div>
<div class="wbox"><div class="wt">Principio rector: privacidad por arquitectura</div><div class="wb">El sistema debe estar construido de tal forma que el abuso sea técnicamente difícil, no solo jurídicamente prohibido.</div></div>
<div class="g2">
  <div>
    <div class="slabel">Qué se captura y qué no</div>
    <div class="monitor">
      <div class="trow"><span class="tn">RUN + timestamp + geolocalización</span><span class="badge bg">Sí · captura</span></div>
      <div class="trow"><span class="tn">Datos biométricos</span><span class="badge br">No · nunca</span></div>
      <div class="trow"><span class="tn">Datos sin encargo</span><span class="badge bg">No persisten</span></div>
      <div class="trow"><span class="tn">Exportación masiva</span><span class="badge br">Prohibida</span></div>
    </div>
    <div style="margin-top:8px" class="ibox"><div class="it">Acceso ciudadano a sus propios datos</div><div class="ib">Canal oficial con plazo de respuesta 15 días hábiles. Cualquier ciudadano puede saber si fue consultado, cuándo y en qué módulo.</div></div>
  </div>
  <div>
    <div class="slabel">Fiscalización y titularidad</div>
    <div class="monitor">
      <div class="trow"><span class="tn">Dueño del dato</span><span class="badge bg">Estado · no negociable</span></div>
      <div class="trow"><span class="tn">Auditor externo</span><span class="badge bb">Consejo Transparencia</span></div>
      <div class="trow"><span class="tn">Logs de auditoría</span><span class="badge bb">Inmutables · 10 años</span></div>
      <div class="trow"><span class="tn">Alertas de uso anómalo</span><span class="badge bb">Automáticas</span></div>
      <div class="trow"><span class="tn">Retención alertas</span><span class="badge bb">5 años máximo</span></div>
    </div>
    <div style="margin-top:8px" class="sbox"><div class="st2">Protocolo ante incidentes</div><div class="sb">Notificación en 72 horas a autoridad y personas afectadas. Plan de contención técnica y comunicación pública preparado antes de operar.</div></div>
  </div>
</div>`},
{label:'06 · Objeciones',h:`
<div class="sh"><div class="snum">06</div><div>
  <div class="stitle">Respuestas a las objeciones frecuentes</div>
  <div class="ssub">preparadas antes de la reunión · no improvisadas en la sala</div>
</div></div>
<div class="objcard"><div class="objq"><i class="ti ti-help-circle" style="font-size:13px;color:var(--amber)" aria-hidden="true"></i>¿Esto no es vigilancia masiva?</div><div class="obja">No. Vigilancia masiva es registro indiscriminado de toda la población. Panoptech contrasta una interacción contra 40.825 personas con órdenes judiciales vigentes emanadas del Poder Judicial. El 99.9% de los ciudadanos no genera alerta y su dato no persiste más de segundos.</div></div>
<div class="objcard"><div class="objq"><i class="ti ti-help-circle" style="font-size:13px;color:var(--amber)" aria-hidden="true"></i>¿Vulnera el derecho a la privacidad?</div><div class="obja">El marco legal vigente autoriza cada punto de captura. Los datos sin encargo no se almacenan. El sistema está diseñado con estándares RGPD europeos — más exigentes que los requerimientos chilenos actuales.</div></div>
<div class="objcard"><div class="objq"><i class="ti ti-help-circle" style="font-size:13px;color:var(--amber)" aria-hidden="true"></i>¿Y si el sistema se equivoca?</div><div class="obja">El sistema nunca es causa única de detención. El operador humano recibe la alerta y decide. Tasa máxima de falsos positivos: 5%. Si se supera, hay revisión técnica automática antes de continuar operando.</div></div>
<div class="objcard"><div class="objq"><i class="ti ti-help-circle" style="font-size:13px;color:var(--amber)" aria-hidden="true"></i>¿Podría usarse para persecución política?</div><div class="obja">El sistema solo puede consultarse contra personas con órdenes judiciales vigentes — universo emanado del Poder Judicial, no del Ejecutivo. Toda consulta queda en registro inmutable. El Consejo para la Transparencia fiscaliza con acceso de solo lectura.</div></div>
<div class="objcard"><div class="objq"><i class="ti ti-help-circle" style="font-size:13px;color:var(--amber)" aria-hidden="true"></i>¿Qué garantías tienen los ciudadanos?</div><div class="obja">Cuatro garantías estructurales: (1) datos sin encargo no almacenados; (2) logs inmutables de toda consulta; (3) Consejo para la Transparencia como fiscalizador independiente; (4) canal oficial para que cualquier ciudadano consulte si fue procesado.</div></div>`},
{label:'07 · Piloto norte',h:`
<div class="sh"><div class="snum">07</div><div>
  <div class="stitle">Diseño del piloto zona norte</div>
  <div class="ssub">Tarapacá · Antofagasta · Arica · 12 meses · presupuesto desglosado</div>
</div></div>
<div class="slabel">Fases de despliegue</div>
<div class="phasebar">
  <div class="phase phon"><div class="phlabel">Fase 0 · Meses 1-2</div><div class="phtitle">Instalación y pruebas</div><div class="phdesc">Setup técnico, capacitación, integración Registro Civil. Sin operación real.</div></div>
  <div class="phase phon"><div class="phlabel">Fase 1 · Meses 3-6</div><div class="phtitle">Operación controlada</div><div class="phdesc">Tarapacá + Antofagasta. ACIP + AVN + ABI. Supervisión diaria.</div></div>
  <div class="phase"><div class="phlabel">Fase 2 · Meses 7-12</div><div class="phtitle">Operación plena</div><div class="phdesc">Arica + módulo ASAT. Evaluación para escalar a nacional.</div></div>
</div>
<div class="g2">
  <div>
    <div class="slabel">KPIs definidos antes de comenzar</div>
    <div class="monitor">
      <div class="trow"><span class="tn">Capturas derivadas del sistema</span><span class="badge bg">≥ 15% de alertas</span></div>
      <div class="trow"><span class="tn">Tiempo captura → alerta</span><span class="badge bg">&lt; 30 segundos</span></div>
      <div class="trow"><span class="tn">Tasa de falsos positivos</span><span class="badge bg">&lt; 5%</span></div>
      <div class="trow"><span class="tn">Reducción prófugos zona</span><span class="badge bb">-10% en 12 meses</span></div>
      <div class="trow"><span class="tn">Satisfacción operadores</span><span class="badge bb">≥ 4 / 5</span></div>
    </div>
  </div>
  <div>

tecnico:{label:'Deck técnico',slides:[
{label:'Portada técnica',h:`
<div class="covhead">
  <div>

<div class="monitor">

  <div class="card card-amber"><div class="ctitle">Lo que Panoptech no hace</div><div class="cbody">No reemplaza ningún sistema institucional. No almacena bases de encargos. No toma decisiones — informa al operador humano.</div></div>

{label:'T1 · Arquitectura',h:`
<div class="sh"><div class="snum">T1</div><div>
  <div class="stitle">Arquitectura funcional de 6 capas</div>
  <div class="ssub">desde la captura en campo hasta la auditoría inmutable</div>
</div></div>
<div class="stepper">
  <div class="step"><div class="stepnum" style="background:var(--blue-dark)">1</div><div><span class="steplabel">Captura en campo</span><span class="stepdesc">App móvil nativa iOS/Android · OCR documentos · geolocalización · modo offline con sincronización diferida para zonas de baja conectividad del norte.</span></div></div>
  <div class="step"><div class="stepnum" style="background:var(--blue-dark)">2</div><div><span class="steplabel">Transmisión segura</span><span class="stepdesc">API REST cifrada TLS 1.3 · autenticación por certificado digital institucional · canal dedicado separado de internet público.</span></div></div>
  <div class="step"><div class="stepnum" style="background:var(--blue-dark)">3</div><div><span class="steplabel">Bus de servicios (ESB) — integración interinstitucional</span><span class="stepdesc">Orquesta consultas a sistemas externos. No almacena datos de encargos — los consulta en tiempo real vía API de solo lectura. Decisión que elimina el debate de soberanía de datos.</span></div></div>
  <div class="step"><div class="stepnum" style="background:var(--blue-dark)">4</div><div><span class="steplabel">Motor de procesamiento y cotejo</span><span class="stepdesc">Algoritmo tolerante a errores tipográficos en nombres. Score de confianza por alerta. Umbral configurable por institución.</span></div></div>
  <div class="step stephi"><div class="stepnum">5</div><div><span class="steplabel">Capa de alertas</span><span class="stepdesc">Push con confirmación de recepción · escalamiento automático si no hay acuse · registro de toda la cadena de notificación.</span></div></div>
  <div class="step"><div class="stepnum" style="background:#333">6</div><div><span class="steplabel">Auditoría inmutable</span><span class="stepdesc">Registro inalterable append-only de cada consulta: usuario, institución, módulo, timestamp, geolocalización, resultado y acción tomada.</span></div></div>
</div>`},
{label:'T2 · Stack',h:`
<div class="sh"><div class="snum">T2</div><div>
  <div class="stitle">Stack tecnológico recomendado</div>
  <div class="ssub">cloud soberano · APIs estándar · mobile nativo · base cifrada</div>
</div></div>
<div class="g2">
  <div>
    <div class="slabel">Infraestructura cloud</div>

      <div class="trow"><span class="tn">Modo offline</span><span class="badge bg">Sincronización diferida · crítico norte</span></div>

      <div class="trow"><span class="tn">Logs de auditoría</span><span class="badge bg">Inmutables · append-only</span></div>

    </div>

{label:'T3 · Datos',h:`
<div class="sh"><div class="snum">T3</div><div>
  <div class="stitle">Modelo de datos — ciclo de vida completo</div>
  <div class="ssub">qué se captura · qué se almacena · quién accede · por cuánto tiempo</div>
</div></div>
<div class="wbox"><div class="wt">Principio de mínima retención — en la arquitectura, no en la política</div><div class="wb">Los ciudadanos sin encargo no tienen dato almacenado. No se puede filtrar lo que no existe.</div></div>
<div class="stepper">
  <div class="step"><div class="stepnum" style="background:var(--blue-dark)">1</div><div><span class="steplabel">Captura</span><span class="stepdesc">RUN o equivalente + timestamp + geolocalización. No se captura biometría ni contenido adicional.</span></div></div>
  <div class="step"><div class="stepnum" style="background:var(--blue-dark)">2</div><div><span class="steplabel">Cotejo en tiempo real</span><span class="stepdesc">Si no hay coincidencia, el dato se descarta en el mismo ciclo de procesamiento. Tiempo de vida: milisegundos.</span></div></div>
  <div class="step stephi"><div class="stepnum">3a</div><div><span class="steplabel">Sin coincidencia → dato no persiste</span><span class="stepdesc">Ciudadano sin encargo no genera ningún registro almacenado. Cero huella. Técnicamente imposible recuperarlo.</span></div></div>
  <div class="step"><div class="stepnum" style="background:#333">3b</div><div><span class="steplabel">Con coincidencia → registro de alerta · retención 5 años</span><span class="stepdesc">Se registra: identificador, módulo, geolocalización, timestamp, institución receptora, score de confianza.</span></div></div>
  <div class="step"><div class="stepnum" style="background:#333">4</div><div><span class="steplabel">Log de auditoría — siempre — retención 10 años</span><span class="stepdesc">Todo evento de consulta queda registrado independientemente del resultado. Inalterable. Accesible solo por auditores independientes.</span></div></div>
</div>
<div class="ibox"><div class="it">Acceso ciudadano a sus propios datos</div><div class="ib">Protocolo de solicitud oficial con plazo de respuesta de 15 días hábiles. El ciudadano puede saber si su RUN fue consultado, cuándo y en qué módulo. Compatible con Ley 20.285 y reforma Ley 19.628.</div></div>`},
{label:'T4 · Integraciones',h:`
<div class="sh"><div class="snum">T4</div><div>
  <div class="stitle">Integraciones con sistemas institucionales</div>
  <div class="ssub">solo lectura · por fases · cada institución mantiene soberanía</div>
</div></div>
<div class="ibox"><div class="it">Decisión arquitectónica que elimina el debate de soberanía de datos</div><div class="ib">Panoptech no replica ni almacena bases de encargos institucionales. Las consulta en tiempo real vía API de solo lectura. SIAP, SABI y los sistemas del Poder Judicial no cambian.</div></div>
<div class="slabel">Mapa de integraciones por fase</div>
<div class="monitor">
  <div class="trow"><span class="tn">Registro Civil — validación de identidad</span><span class="badge bg">Fase 1 · infraestructura moderna · prioritaria</span></div>
  <div class="trow"><span class="tn">Poder Judicial — órdenes de aprehensión</span><span class="badge bg">Fase 1 · fuente primaria de encargos</span></div>
  <div class="trow"><span class="tn">SIAP · Carabineros</span><span class="badge bb">Fase 1-2 · cotejo y derivación</span></div>
  <div class="trow"><span class="tn">SABI · PDI</span><span class="badge bb">Fase 1-2 · cotejo y derivación</span></div>
  <div class="trow"><span class="tn">DGAC — vuelos nacionales</span><span class="badge bb">Fase 1 · módulo AVN</span></div>
  <div class="trow"><span class="tn">Gendarmería — recintos</span><span class="badge ba">Fase 2 · módulo AIRP</span></div>
</div>
<div class="wbox"><div class="wt">Riesgo crítico — SIAP y SABI no tienen APIs públicas hoy</div><div class="wb">Conseguirlas puede tomar 6 a 18 meses de negociación técnica bilateral. Estrategia: comenzar con Registro Civil y construir SIAP y SABI incrementalmente. El pitch político no puede prometer plazos que la realidad técnica no puede cumplir.</div></div>`},
{label:'T5 · Seguridad',h:`
<div class="sh"><div class="snum">T5</div><div>
  <div class="stitle">Seguridad y disponibilidad</div>
  <div class="ssub">estándares de infraestructura crítica · SLA · contingencia · respuesta a incidentes</div>
</div></div>
<div class="g2">
  <div>
    <div class="slabel">Estándares de seguridad</div>
    <div class="monitor">
      <div class="trow"><span class="tn">ISO 27001</span><span class="badge bg">Requerido</span></div>
      <div class="trow"><span class="tn">AES-256 en reposo</span><span class="badge bg">Requerido</span></div>
      <div class="trow"><span class="tn">TLS 1.3 en tránsito</span><span class="badge bg">Requerido</span></div>
      <div class="trow"><span class="tn">Pentesting semestral</span><span class="badge bg">Tercero independiente certificado</span></div>
      <div class="trow"><span class="tn">CSIRT Chile compatible</span><span class="badge bg">Notificación obligatoria de incidentes</span></div>
      <div class="trow"><span class="tn">SOC 2 Type II</span><span class="badge ba">Recomendado año 2</span></div>
    </div>
  </div>
  <div>
    <div class="slabel">Disponibilidad y contingencia</div>
    <div class="monitor">
      <div class="trow"><span class="tn">SLA mínimo</span><span class="badge bg">99.5% disponibilidad</span></div>
      <div class="trow"><span class="tn">Arquitectura</span><span class="badge bb">Activo-activo · 2 zonas geo</span></div>
      <div class="trow"><span class="tn">RTO ante desastre</span><span class="badge bb">&lt; 4 horas</span></div>
      <div class="trow"><span class="tn">RPO máximo</span><span class="badge bb">&lt; 1 hora</span></div>
      <div class="trow"><span class="tn">Modo degradado</span><span class="badge bk">Definido por módulo</span></div>
      <div class="trow"><span class="tn">Drill contingencia</span><span class="badge bk">Semestral obligatorio</span></div>
    </div>
  </div>
</div>
<div class="card card-green"><div class="ctitle">Protocolo de respuesta ante incidentes</div><div class="cbody" style="margin-top:4px">Notificación a CSIRT Chile, autoridad competente y personas afectadas en 72 horas (estándar RGPD). Análisis forense independiente en 48 horas. Este protocolo se ensaya antes de que el sistema entre en operación real.</div></div>`},
{label:'T6 · Auditoría',h:`
<div class="sh"><div class="snum">T6</div><div>
  <div class="stitle">Modelo de auditoría y control de accesos</div>
  <div class="ssub">registro inmutable · roles diferenciados · alertas de uso anómalo · fiscalización externa</div>
</div></div>
<div class="sbox"><div class="st2">La auditoría es el núcleo de legitimidad política del sistema</div><div class="sb">Sin auditoría robusta e independiente, este sistema es políticamente insostenible. El modelo de auditoría se diseña con el mismo rigor que el motor de cotejo.</div></div>
<div class="g2">
  <div>
    <div class="slabel">Qué queda registrado en cada consulta</div>

let cs=0,cr=0;
const sk=Object.keys(D);
function bSec(){const el=document.getElementById('sectabs');el.innerHTML='';sk.forEach((k,i)=>{const b=document.createElement('button');b.className='stab'+(i===0?' on':'');b.textContent=D[k].label;b.onclick=()=>swSec(i);el.appendChild(b);})}
function bST(){const el=document.getElementById('slidetabs');el.innerHTML='';D[sk[cs]].slides.forEach((s,i)=>{const b=document.createElement('button');b.className='slt'+(i===cr?' on':'');b.textContent=s.label;b.onclick=()=>goTo(i);el.appendChild(b);})}
function bSl(){const el=document.getElementById('slides');el.innerHTML='';D[sk[cs]].slides.forEach((s,i)=>{const d=document.createElement('div');d.className='slide'+(i===cr?' on':'');d.innerHTML=s.h;el.appendChild(d);})}
function uN(){const sl=D[sk[cs]].slides;document.getElementById('pb').disabled=cr===0;document.getElementById('nb').disabled=cr===sl.length-1;document.getElementById('ctr').textContent=D[sk[cs]].label+' · '+(cr+1)+'/'+sl.length;document.querySelectorAll('.slt').forEach((t,i)=>t.classList.toggle('on',i===cr));}
function goTo(n){document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('on',i===n));cr=n;uN();}
function swSec(n){cs=n;cr=0;document.querySelectorAll('.stab').forEach((t,i)=>t.classList.toggle('on',i===n));bST();bSl();uN();}
function nav(d){const sl=D[sk[cs]].slides;goTo(Math.max(0,Math.min(sl.length-1,cr+d)));}
bSec();swSec(0);
</script>
